spring.datasource.url=jdbc:mysql://mysql-order:3306/orderdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@discovery-server:8761/eureka/
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/spring-boot-microservices-realm
spring.kafka.bootstrap-servers=broker:29092
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
keycloak.token-uri=http://keycloak:8080/realms/spring-boot-microservices-realm/protocol/openid-connect/token



